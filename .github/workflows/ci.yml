name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions:
  contents: read
jobs:
  mcp-server:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: packages/mcp-server } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '20' }
      - run: npm install
      - run: npm run build
      # tests/memory-migration asserts against historical migration scripts that
      # are not shipped in this repo — excluded until they are vendored or removed.
      - run: npx vitest run --exclude "tests/memory-migration/**"
